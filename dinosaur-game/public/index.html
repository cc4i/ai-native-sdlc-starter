<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>T-Rex Endless Runner - AI SDLC Edition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <div class="hud">
      <div class="hud-left">
        <div class="sdlc-badge">AI SDLC Edition (DSH Native)</div>
        <div class="hud-actions">
          <button class="icon-btn" id="pauseBtn" title="Pause / Resume (P)">⏸ PAUSE</button>
          <button class="icon-btn" id="muteBtn" title="Mute / Unmute (M)">🔊 SOUND</button>
        </div>
      </div>
      <div class="score-board">
        <span class="hi-score" id="hiScoreDisplay">HI 00000</span>
        <span class="current-score" id="scoreDisplay">00000</span>
      </div>
    </div>
    
    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="800" height="240"></canvas>
      <div class="overlay" id="startOverlay">
        <div class="title">T-REX RUNNER</div>
        <div class="prompt">Press <kbd>SPACE</kbd> or Tap to Jump</div>
        <div class="controls-hint">
          <span><kbd>▲</kbd> / <kbd>SPACE</kbd> Jump</span>
          <span><kbd>▼</kbd> Duck</span>
          <span><kbd>P</kbd> Pause</span>
          <span><kbd>M</kbd> Mute</span>
        </div>
      </div>
      <div class="overlay hidden" id="pauseOverlay">
        <div class="title">PAUSED</div>
        <div class="prompt">Press <kbd>P</kbd> or <kbd>SPACE</kbd> to resume</div>
        <button class="restart-btn" id="resumeBtn">▶ RESUME</button>
      </div>
      <div class="overlay hidden" id="gameOverOverlay">
        <div class="game-over-text">G A M E &nbsp; O V E R</div>
        <button class="restart-btn" id="restartBtn">↻ PLAY AGAIN</button>
      </div>
    </div>

    <div class="mobile-controls">
      <button class="mobile-btn" id="duckBtn">DUCK (▼)</button>
      <button class="mobile-btn primary" id="jumpBtn">JUMP (▲)</button>
    </div>

    <footer class="game-footer">
      <span>Built with <strong>AI-Native SDLC</strong> &amp; <strong>DeepSeek Harness</strong></span>
      <span>• Zero External Assets • Web Audio API Synthesized</span>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
