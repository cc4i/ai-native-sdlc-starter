name: Continuous AI Evals

on:
  pull_request:
    paths:
      - 'GEMINI.md'
      - 'REVIEW.md'
      - '.gemini/**'
      - 'templates/**'
      - 'evals/**'
  push:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *' # Nightly regression run

jobs:
  evals:
    name: Run AI Instruction Evals
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Run Continuous Evals
        run: |
          python3 evals/run_evals.py
