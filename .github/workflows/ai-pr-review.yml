name: AI PR Review & Policy Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: Autonomous AI Code Review & Policy Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Local Verification Loop
        run: make verify

      - name: Run Artifact Traceability Check
        run: bash scripts/check-artifacts.sh

      - name: Execute Autonomous ReviewAgent on PR Diff
        id: run_review
        run: |
          mkdir -p docs/reviews reviews
          REPORT_DIR="reviews"
          if [ -d "docs/reviews" ]; then REPORT_DIR="docs/reviews"; fi
          python3 -m src.cli review-pr --base origin/${{ github.base_ref }} --output "${REPORT_DIR}/pr-audit.md" || echo "REVIEW_FAILED=true" >> $GITHUB_ENV

      - name: Post Review Audit Report Comment to PR
        uses: actions/github-script@v7
        if: always() && steps.run_review.outcome != 'skipped'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let reportPath = 'docs/reviews/pr-audit.md';
            if (!fs.existsSync(reportPath)) {
              reportPath = 'reviews/pr-audit.md';
            }
            if (fs.existsSync(reportPath)) {
              const body = fs.readFileSync(reportPath, 'utf8');
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const botComment = comments.find(comment => comment.body.includes('# PR Review Audit Report'));
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body
                });
              }
            }

      - name: Enforce PR Review Verdict
        run: |
          if [ "${{ env.REVIEW_FAILED }}" = "true" ]; then
            echo "❌ PR Review BLOCKED or CHANGES_REQUESTED. Please fix identified findings before merging."
            exit 1
          else
            echo "✅ PR Review PASSED cleanly."
          fi
