name: AI PR Review & Policy Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: Autonomous AI Code Review & Policy Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Run Local Verification Loop
        run: make verify

      - name: Run Artifact Traceability Check
        run: bash scripts/check-artifacts.sh

      - name: Execute Autonomous ReviewAgent on PR Diff
        id: run_review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.7-flash' }}
        run: |
          mkdir -p docs/reviews reviews
          REPORT_DIR="reviews"
          if [ -d "docs/reviews" ]; then REPORT_DIR="docs/reviews"; fi
          python3 -m src.cli review-pr \
            --base origin/${{ github.base_ref }} \
            --output "${REPORT_DIR}/pr-audit.md" \
            --inline-json "${REPORT_DIR}/inline-review.json" \
            --use-gemini \
            --model "$GEMINI_MODEL" || echo "REVIEW_FAILED=true" >> $GITHUB_ENV

      - name: Publish Inline PR Review Comments & Audit Report
        uses: actions/github-script@v7
        if: always() && steps.run_review.outcome != 'skipped'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            let reportDir = fs.existsSync('docs/reviews') ? 'docs/reviews' : 'reviews';
            let inlineJsonPath = path.join(reportDir, 'inline-review.json');
            let reportPath = path.join(reportDir, 'pr-audit.md');

            // 1. If inline comments exist, publish via Pull Request Review API
            if (fs.existsSync(inlineJsonPath)) {
              try {
                const payload = JSON.parse(fs.readFileSync(inlineJsonPath, 'utf8'));
                if (payload.comments && payload.comments.length > 0) {
                  console.log(`Publishing ${payload.comments.length} inline review comment(s)...`);
                  await github.rest.pulls.createReview({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.issue.number,
                    body: payload.body,
                    event: 'COMMENT',
                    comments: payload.comments,
                  });
                  return;
                }
              } catch (err) {
                console.warn('Notice: Failed to submit inline review, falling back to discussion comment:', err);
              }
            }

            // 2. Fallback / Clean PR: Post or update single discussion comment
            if (fs.existsSync(reportPath)) {
              const body = fs.readFileSync(reportPath, 'utf8');
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const botComment = comments.find(comment => comment.body.includes('# PR Review Audit Report'));
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body
                });
              }
            }

      - name: Enforce PR Review Verdict
        run: |
          if [ "${{ env.REVIEW_FAILED }}" = "true" ]; then
            echo "❌ PR Review BLOCKED or CHANGES_REQUESTED. Please fix identified findings before merging."
            exit 1
          else
            echo "✅ PR Review PASSED cleanly."
          fi
